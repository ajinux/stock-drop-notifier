# Stock Market Alert Configuration
alerts:
    - name: Amazon monthly Drop (From Peak)
      symbol: AMZN
      condition:
        type: percent_change
        threshold: -10
        period: 3m
        calculation_method: from_peak
      enabled: true
    - name: AAPL monthly Drop (From Peak)
      symbol: AAPL
      condition:
        type: percent_change
        threshold: -5
        period: 1m
        calculation_method: from_peak
      enabled: true
    - name: Russell 2000 Monthly drop (From Peak)
      symbol: IWM
      condition:
        type: percent_change
        threshold: -7
        period: 1m
        calculation_method: from_peak
      enabled: true
    - name: Nasdaq 100 Monthly drop (From Peak)
      symbol: QQQ
      condition:
        type: percent_change
        threshold: -5
        period: 1m
        calculation_method: from_peak
      enabled: true
    - name: S&P 500 Monthly drop (From Peak)
      symbol: SPY
      condition:
        type: percent_change
        threshold: -5
        period: 1m
        calculation_method: from_peak
      enabled: true
    - name: NVDA Monthly Drop (From Peak)
      symbol: NVDA
      condition:
        type: percent_change
        threshold: -8
        period: 1m
        calculation_method: from_peak
      enabled: true
    - name: META Monthly Drop (From Peak)
      symbol: META
      condition:
        type: percent_change
        threshold: -8
        period: 1m
        calculation_method: from_peak
      enabled: true

